default_install_hook_types: [pre-commit, pre-push]
exclude: ^(suckless|flexipatch)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: local
    hooks:
      - id: nix-treefmt
        name: Nix Treefmt
        description: Run formatters to worktree
        entry: nix fmt
        language: system
        files: \\.nix$
        types: [file]
