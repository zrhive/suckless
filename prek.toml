exclude = "(^suckless/.*|^flexipatch/.*)"

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-toml" },
  { id = "end-of-file-fixer" },
  {
    id = "trailing-whitespace",
    args = [ "--markdown-linebreak-ext=*" ],
  },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "treefmt",
    name = "treefmt",
    entry = "treefmt --ci",
    language = "system",
  },
]
